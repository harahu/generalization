name = "generalization-linter"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["GeneralizationLinter"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
# Match TauCeti upstream main; update lean-toolchain and lake-manifest.json together.
rev = "3b531c35df33d6bbe64b4e87dec056211d3a5676"

[[lean_lib]]
name = "GeneralizationLinter"

