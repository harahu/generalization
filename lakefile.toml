name = "generalization-linter"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["GeneralizationLinter"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
# Match TauCeti upstream main; update lean-toolchain and lake-manifest.json together.
rev = "2e318faecff7d70d4e0cf8cc875104424a737355"

[[lean_lib]]
name = "GeneralizationLinter"

