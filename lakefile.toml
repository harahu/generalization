name = "generalization-linter"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["GeneralizationLinter"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
# Match TauCeti upstream main; update lean-toolchain and lake-manifest.json together.
rev = "6b7abb3c7686292736be2955bd3eb9ebf63b456a"

[[lean_lib]]
name = "GeneralizationLinter"

